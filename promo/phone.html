<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
html,body{margin:0;width:100%;height:100%;background:#d8d4cc;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;color:#17181b}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:120px}
.copy{display:grid;gap:22px;max-width:620px}
.label{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#5f5c56}
h1{margin:0;font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:110px;line-height:.9}
p{margin:0;font-size:30px;line-height:1.35;color:#3a3833}
.phone{position:relative;width:410px;height:874px;border-radius:58px;background:#0c0c0e;padding:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.screen{width:390px;height:844px;border-radius:44px;overflow:hidden;background:#17181b;position:relative}
iframe{border:0;width:390px;height:844px;display:block}
.notch{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#0c0c0e;z-index:2}
body.v .wrap{flex-direction:column;gap:64px}
body.v .copy{text-align:center;justify-items:center}
body.v h1{font-size:104px}
body.v p{font-size:32px;max-width:24ch}
body.v .phone{transform:scale(1.42);margin:184px 0}
</style></head><body>
<div class="wrap">
  <div class="copy"><div class="label">Адаптив</div><h1>Зручно<br>з телефона</h1><p>Меню, фільтри, кошик і підбір розміру працюють на будь-якому екрані.</p></div>
  <div class="phone"><div class="notch"></div><div class="screen"><iframe id="f" src="terikon/index.html"></iframe></div></div>
</div>
<script>if(new URLSearchParams(location.search).get('v'))document.body.classList.add('v')</script>
</body></html>
